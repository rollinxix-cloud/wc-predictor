<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHAT HUB | World Cup Pool</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gradient-to-b from-slate-950 via-slate-900 to-emerald-950/40 text-slate-100 font-sans min-h-screen antialiased flex flex-col">

    <div class="h-1 bg-gradient-to-r from-amber-500 via-emerald-500 to-blue-600 w-full"></div>

    <header class="border-b border-slate-800/80 bg-slate-950/50 backdrop-blur-md">
        <div class="max-w-4xl mx-auto px-4 h-16 flex justify-between items-center">
            <div class="flex items-center gap-2.5">
                <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
                <h1 class="font-black text-sm uppercase tracking-wider text-slate-200">
                    Pool Trash Talk Hub
                </h1>
            </div>
            <a href="index.html" class="bg-slate-900 hover:bg-slate-800 border border-slate-800 text-xs font-bold px-4 py-2 rounded-xl transition-all flex items-center gap-2">
                <i class="fa-solid fa-arrow-left"></i> Back to Dashboard
            </a>
        </div>
    </header>

    <main class="flex-1 max-w-4xl w-full mx-auto p-4 flex flex-col justify-center items-center my-4">
        <div class="w-full max-w-2xl h-[550px] bg-slate-900/80 border border-slate-800 rounded-2xl shadow-2xl flex flex-col overflow-hidden">
            
            <div class="bg-slate-950/60 border-b border-slate-800 p-4 flex justify-between items-center">
                <div class="text-xs font-bold text-slate-400 flex items-center gap-2">
                    <i class="fa-solid fa-comments text-emerald-400"></i>
                    <span>Live Message Board</span>
                </div>
                <span class="text-[10px] font-bold text-emerald-400 bg-emerald-950/50 px-2 py-0.5 rounded border border-emerald-900/30">
                    Online
                </span>
            </div>

            <div id="chat-messages-box" class="flex-1 p-4 overflow-y-auto space-y-3 text-xs">
                <div class="bg-slate-950/40 border border-slate-850 p-3 rounded-xl text-slate-400 italic text-center text-[11px]">
                    Welcome to the Live Hub! Drop your predictions or trash talk below.
                </div>
            </div>

            <form id="chat-form" class="p-4 bg-slate-950/60 border-t border-slate-800 flex gap-2">
                <input id="chat-input-field" type="text" placeholder="Type a message..." required autocomplete="off"
                       class="flex-1 bg-slate-900 border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-slate-100 placeholder-slate-500 focus:outline-none focus:border-emerald-500 transition-colors">
                <button type="submit" class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 px-4 rounded-xl text-xs font-bold transition-colors cursor-pointer flex items-center justify-center">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </form>
        </div>
    </main>

    <script>
        const chatForm = document.getElementById('chat-form');
        const chatInputField = document.getElementById('chat-input-field');
        const chatMessagesBox = document.getElementById('chat-messages-box');

        // Loads and displays messages saved in browser localStorage
        function loadChatFeed() {
            const logs = JSON.parse(localStorage.getItem('wc_chat_logs')) || [];
            if (logs.length > 0) {
                chatMessagesBox.innerHTML = '';
            }
            
            logs.forEach(msg => {
                const bubble = `
                    <div class="space-y-1 max-w-[85%]">
                        <div class="flex items-center gap-2 text-[10px] text-slate-500 px-1">
                            <span class="font-bold text-emerald-400/90">Pool Player</span>
                            <span>•</span>
                            <span>${msg.time}</span>
                        </div>
                        <div class="bg-slate-950 border border-slate-850 text-slate-200 p-2.5 rounded-xl break-words font-medium shadow-inner">
                            ${msg.text}
                        </div>
                    </div>`;
                chatMessagesBox.insertAdjacentHTML('beforeend', bubble);
            });
            chatMessagesBox.scrollTop = chatMessagesBox.scrollHeight;
        }

        // Intercepts input submission and publishes message block
        chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = chatInputField.value.trim();
            if (!text) return;

            const logs = JSON.parse(localStorage.getItem('wc_chat_logs')) || [];
            const timestamp = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            
            logs.push({ text: text, time: timestamp });
            localStorage.setItem('wc_chat_logs', JSON.stringify(logs));
            
            chatInputField.value = '';
            loadChatFeed();
        });

        // Initialize chat history display on page loading finish
        loadChatFeed();
    </script>
</body>
</html>
